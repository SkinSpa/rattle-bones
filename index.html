<!doctype html>
<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skeleton Second Line: Pure CSS Parade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="./style.css">

<body>

  <main class="scene">
    <!-- the switch: hidden checkbox, flipped by the START THE PARADE label below -->
    <input type="checkbox" id="start" class="start-switch">

    <!-- blurred copy of the cemetery, fills the edges on tall screens -->
    <img class="scene-fill" src="backgrounds/metairie-cemetery-poster.webp" alt="" aria-hidden="true">

    <!-- THE STAGE: the video and everything pinned to it share this 16:9 box -->
    <div class="stage haunt-stage" aria-hidden="true">
      <video class="stage-video" autoplay muted loop playsinline preload="auto"
        poster="backgrounds/metairie-cemetery-poster.webp">
        <source src="videos/metairie-cemetery.mp4" type="video/mp4">
      </video>

      <!-- always on: the two gate lanterns flicker, pinned to the lamps in the video -->
      <i class="hv-lamp hv-lamp-left"></i><i class="hv-lamp hv-lamp-right"></i>

      <!-- THE PARADE: hidden until START THE PARADE is clicked, then every animation starts at once -->
      <div class="parade">
        <!-- THE PARADE: six krewes, each a banner with its own second liners behind it, and each krewe
           comes in a different way (the game's level paths, see "ENTRANCES" in parade.css).
           --path = which way it walks; --d = when it steps out of the tomb, counted from the click. -->
        <!-- THE SKY: bats and crows, timed to the parade (--d = seconds after the click). Styles: "BATS AND CROWS" in parade.css -->
        <div class="sky">
          <!-- A CLOUD SLIDES OVER THE MOON (from the game's level 2), once, from "Hats off" while the jazz funeral comes through -->
          <div class="hv-cloud-track" aria-hidden="true"><i class="hv-cloud"></i></div>
          <!-- CROWS: two cross the sky, left to right, on "Welcome to Metairie Cemetery" -->
          <div class="hv-track crow-fly" style="--y:15.2%;--rise:-2.9%;--dur:12.6s;--d:7.50s"><i class="crow"
              style="--s:5.3%;--f:0.52s"><b class="wing far"></b><b class="body"></b><b class="wing near"></b></i></div>
          <div class="hv-track crow-fly" style="--y:18.5%;--rise:1.3%;--dur:11.6s;--d:8.12s"><i class="crow"
              style="--s:7.3%;--f:0.52s"><b class="wing far"></b><b class="body"></b><b class="wing near"></b></i></div>
          <!-- BATS ACROSS THE MOON: a swarm, right to left, on "Make way for the second line" -->

          <div class="hv-track bat-cross" style="--y:15.5%;--d:15.90s"><i style="--s:3.4%;--f:0.26s"></i></div>
          <div class="hv-track bat-cross" style="--y:8.2%;--d:16.25s"><i style="--s:2.9%;--f:0.29s"></i></div>
          <div class="hv-track bat-cross" style="--y:20.3%;--d:16.58s"><i style="--s:3.8%;--f:0.21s"></i></div>

                    <path d="M-13 12L13 -14M13 12L-13 -14" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round" />
                  </g>
                  <text x="154" y="26" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
                    font-weight="700" font-size="13" fill="#4d4d4d" textLength="108" lengthAdjust="spacingAndGlyphs">The
                    Bone Rattlers</text>
                  <text x="154" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600"
                    font-size="5.6" letter-spacing=".8" fill="#cccccc" textLength="108"
                    lengthAdjust="spacingAndGlyphs">Living that afterlife glow.</text>
                </g>
              </svg></div>
          </div>
        </div>
      </div>
    </div>


    <!-- THE TITLE CARD: the click that starts it all -->
    <div class="title-card">
      <p class="kicker">SKIN SPA NEW YORK CEMETERY · AFTER MIDNIGHT</p>
      <h1>The Bone Rattlers<br><span>Second Line</span></h1>
      <label for="start" class="start-btn">START THE PARADE</label>
      <p class="note">Sound on, cher.</p>
    </div>

    <!-- THE REPLAY CARD: fades in after the show (141s after the click: the song ends at 137.6s,
       the Grim Reaper slips into the tomb at ~139.8s, the last bats are gone by ~140.8s). REPLAY is a plain link back to this page:
       a CSS animation can't rewind itself, so the page reloads to the title card, ready to march again. -->
    <div class="replay-card">
      <p class="kicker">THE KREWE HAS GONE HOME</p>
      <h2>Encore?</h2>
      <a href="" class="start-btn">REPLAY THE PARADE</a>
      <p class="note">Life is short. Afterlife is longer..</p>
    </div>

    <!-- THE CONTROLS: shown after the click.
       The player loads eagerly so the start click can call play() in its audio document.
       HIDE CAPTIONS is a label for the #captions-off checkbox: it hides the captions.
       RESTART reloads the page back to the title card. -->
    <div class="controls">
      <iframe class="player" src="song.html" loading="eager" allow="autoplay" title="The music"></iframe>
      <!-- RESTART: a plain link back to this page, so it reloads to the title card (CSS can't rewind an animation) -->
      <a href="" class="ctrl-btn restart-btn">RESTART</a>
    </div>
  </main>
  <script>
    const startSwitch = document.querySelector('#start');
    const player = document.querySelector('.player');

    startSwitch.addEventListener('change', () => {
      if (!startSwitch.checked) return;

      const audio = player.contentDocument?.querySelector('audio');
      if (audio) {
        audio.play().catch((error) => console.error('Could not start the music:', error));
      }
    });
  </script>
